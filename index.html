<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<title>CodeTonight · Tell us about your venture</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%230f2a4a' width='100' height='100'/%3E%3Crect x='15' y='48' width='70' height='5' fill='%231f8a70'/%3E%3C/svg%3E">
<style>
  :root { --paper:#f5f6f9; --ink:#0f2a4a; --muted:#5b6572; --accent:#1f8a70; --rule:#d5dce5;
          --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
          --mono:'JetBrains Mono','SF Mono',Menlo,monospace; }
  @media (prefers-color-scheme: dark){ :root{ --paper:#0d1420; --ink:#e7edf5; --muted:#93a0b0; --rule:#28323f; } }
  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--sans); min-height:100dvh;
        display:grid; grid-template-rows:auto 1fr auto; }
  header,main,footer{ padding:clamp(1.25rem,4vw,2rem); }
  header{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--rule); }
  .brand{ font-family:var(--mono); font-size:.9rem; font-weight:600; letter-spacing:-.01em; }
  .brand .accent{ color:var(--accent); }
  main{ display:grid; align-content:center; max-width:44rem; margin:0 auto; width:100%; gap:1.5rem; }
  h1{ font-size:clamp(1.8rem,5vw,3rem); font-weight:300; letter-spacing:-.02em; line-height:1.12; max-width:20ch; }
  p.lede{ font-size:clamp(1rem,2vw,1.2rem); color:var(--muted); max-width:44ch; }
  .cta{ display:inline-flex; align-items:center; gap:.5rem; padding:.9rem 1.6rem; background:var(--ink);
        color:var(--paper); font-family:var(--mono); font-size:.9rem; text-decoration:none; width:max-content;
        border:1px solid var(--ink); transition:background .2s; }
  .cta:hover{ background:var(--accent); border-color:var(--accent); }
  .fine{ font-family:var(--mono); font-size:.75rem; color:var(--muted); }
  footer{ border-top:1px solid var(--rule); font-family:var(--mono); font-size:.75rem; color:var(--muted);
          display:flex; justify-content:space-between; gap:.5rem; flex-wrap:wrap; }
</style>
</head>
<body>
  <header>
    <span class="brand">Code<span class="accent">Tonight</span></span>
    <span class="fine">Venture Building</span>
  </header>
  <main>
    <h1>Tell us about your venture.</h1>
    <p class="lede">Six quick questions, about three minutes. No wrong answers. We'll come back to you with an honest read — what's quick, what's hard, and where we can help.</p>
    <a class="cta" href="/ultralead/quiz?firm=venture_building">Start <span>&rarr;</span></a>
  </main>
  <footer>
    <span>CodeTonight &middot; codetonight.co.za</span>
    <span>Tech for good.</span>
  </footer>
</body>
</html>
