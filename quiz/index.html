<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0">
<title>ULTRALEAD · Quiz</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%23F5F4F0' width='100' height='100'/%3E%3Crect x='15' y='48' width='70' height='4' fill='%23FF6600'/%3E%3C/svg%3E">
<style>
:root {
  --paper: #F5F4F0;
  --ink: #1A1A1A;
  --muted: #5B5550;
  --rule: #D8D3CC;
  --accent: #FF6600;
  --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  --tempo: 400ms;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: clamp(16px, 0.5vw + 0.8rem, 18px);
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}
header, main, footer {
  padding: clamp(1.25rem, 4vw, 2rem);
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--rule);
}
.brand {
  font-family: var(--mono);
  font-size: 0.875rem;
  letter-spacing: 0.02em;
  font-weight: 500;
}
.brand .accent { color: var(--accent); }
.progress {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.progress .bar {
  display: inline-block;
  width: 80px;
  height: 2px;
  background: var(--rule);
  margin-left: 0.5rem;
  vertical-align: middle;
  overflow: hidden;
}
.progress .bar > i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width var(--tempo) var(--ease);
}
main {
  display: grid;
  align-content: center;
  max-width: 48rem;
  margin: 0 auto;
  width: 100%;
  gap: clamp(1.25rem, 2.5vw, 2rem);
}
.qcard {
  display: grid;
  gap: clamp(1rem, 2vw, 1.5rem);
}
.qmeta {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.08em;
}
h2.qtext {
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  font-weight: 300;
  letter-spacing: -0.02em;
  line-height: 1.2;
  max-width: 26ch;
}
.options {
  display: grid;
  gap: 0.5rem;
}
.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 1rem 1.25rem;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--rule);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.4;
  cursor: pointer;
  min-height: 44px;
  transition: border-color var(--tempo) var(--ease), background var(--tempo) var(--ease), transform 120ms ease;
  position: relative;
}
.opt:hover,
.opt:focus-visible {
  border-color: var(--ink);
  outline: none;
}
.opt:active { transform: translateY(1px); }
.opt[aria-pressed="true"] {
  border-color: var(--accent);
  background: rgba(255, 102, 0, 0.05);
}
.opt[aria-pressed="true"]::before {
  content: "▌";
  color: var(--accent);
  position: absolute;
  left: 0.25rem;
}
textarea.freetext {
  width: 100%;
  min-height: 8rem;
  padding: 1rem 1.25rem;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--rule);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.5;
  resize: vertical;
}
textarea.freetext:focus-visible {
  border-color: var(--ink);
  outline: none;
}
.actions {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.875rem 1.5rem;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 0.875rem;
  letter-spacing: 0.02em;
  cursor: pointer;
  border: 1px solid var(--ink);
  min-height: 44px;
  transition: background var(--tempo) var(--ease);
}
.btn:hover, .btn:focus-visible {
  background: var(--accent);
  border-color: var(--accent);
  outline: none;
}
.btn[disabled] {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}
.btn.ghost {
  background: transparent;
  color: var(--ink);
}
.btn.ghost:hover, .btn.ghost:focus-visible {
  background: transparent;
  color: var(--accent);
}
.fineprint {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--muted);
}
footer {
  border-top: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.reveal {
  opacity: 0;
  transform: translateY(8px);
  transition: opacity var(--tempo) var(--ease), transform var(--tempo) var(--ease);
  will-change: opacity, transform;
}
.reveal.revealed {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal { transition: none; opacity: 1; transform: none; }
}
@media (max-width: 480px) {
  footer { flex-direction: column; }
}
</style>
</head>
<body>

<header>
  <a href="/ultralead/" class="brand" style="text-decoration:none;color:inherit"><span class="accent">▌</span> ULTRALEAD</a>
  <div class="progress" id="progress" aria-live="polite">
    <span id="progress-text">0 / 7</span>
    <span class="bar"><i id="progress-bar"></i></span>
  </div>
</header>

<main id="main" aria-live="polite">
  <div class="qcard" id="qcard">
    <div class="qmeta reveal" id="qmeta">Loading…</div>
    <h2 class="qtext reveal" id="qtext"></h2>
    <div class="options reveal" id="options"></div>
    <div class="actions reveal" id="actions"></div>
  </div>
</main>

<footer>
  <span>ULTRALEAD · find the right help</span>
  <span class="fineprint">No tracking until you opt in.</span>
</footer>

<script src="/ultralead/config.js"></script>
<script type="module">
// Absolute paths (not "./lib/..."): /quiz is served WITHOUT a trailing slash
// (vercel.json cleanUrls:true + trailingSlash:false), so a relative import
// resolves against "/" and 404s (/lib/funnel.js). "/quiz/lib/*.js" is
// trailing-slash-safe. Do not "simplify" back to relative — it re-breaks the page.
import {
  STAGES, newSession, load, persist, clear, startQuiz,
  answerQuestion, submitCTA, currentQuestion, progress, finalise,
} from "/ultralead/quiz/lib/funnel.js";
import { reveal, hide, staggerReveal } from "/ultralead/quiz/lib/reveal.js";

// W2: client-only key. W4 will move signing to the server.
// This key is INTENTIONALLY public — the client chain is a HINT for replay
// continuity. Server re-signs everything on submit using a server-only key.
const CLIENT_KEY = "ultralead-client-hint-key-v0";

const params = new URLSearchParams(location.search);
const firm = params.get("firm") || "_default";

const qcard = document.getElementById("qcard");
const qmeta = document.getElementById("qmeta");
const qtext = document.getElementById("qtext");
const optionsEl = document.getElementById("options");
const actionsEl = document.getElementById("actions");
const progressText = document.getElementById("progress-text");
const progressBar = document.getElementById("progress-bar");

let state = load() || newSession({ firm });
let questions = null;

async function bootstrap() {
  try {
    const res = await fetch(`/ultralead/firms/${firm}/questions.json`, { credentials: "omit" });
    if (!res.ok) throw new Error(`questions.json ${res.status}`);
    questions = await res.json();
  } catch (err) {
    qmeta.textContent = "Couldn't load. Please retry.";
    qtext.textContent = String(err.message || err);
    reveal(qmeta, 600); reveal(qtext, 600);
    return;
  }

  if (state.stage === STAGES.IDLE) {
    const r = await startQuiz(state, CLIENT_KEY, questions);
    if (r.ok) { state = r.state; persist(state); }
  }
  renderCurrent();
}

function renderCurrent() {
  const q = currentQuestion(state, questions);
  const p = progress(state, questions);
  progressText.textContent = `${p.answered} / ${p.total}`;
  progressBar.style.width = `${Math.round(p.fraction * 100)}%`;

  if (state.stage === STAGES.CTA) return renderCTA();
  if (state.stage === STAGES.DONE) return renderDone();
  if (!q) return;

  hide(qmeta); hide(qtext); hide(optionsEl); hide(actionsEl);

  const tempo = q.tempo_ms || 400;
  qmeta.textContent = `${q.category.replace(/_/g, " ")} · ${state.q_index + 1} of ${questions.questions.length}`;
  qtext.textContent = q.text;

  optionsEl.innerHTML = "";
  actionsEl.innerHTML = "";

  if (q.input === "textarea") {
    const ta = document.createElement("textarea");
    ta.className = "freetext";
    ta.placeholder = q.placeholder || "Optional";
    ta.maxLength = q.max_length || 280;
    optionsEl.appendChild(ta);

    const nextBtn = mkBtn("Continue", "btn");
    const skipBtn = mkBtn("Skip", "btn ghost");
    actionsEl.appendChild(nextBtn);
    actionsEl.appendChild(skipBtn);
    nextBtn.onclick = () => submitAnswer(q.id, ta.value.trim());
    skipBtn.onclick = () => submitAnswer(q.id, "");
  } else {
    q.options.forEach((opt) => {
      const b = document.createElement("button");
      b.className = "opt reveal";
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.textContent = opt.label;
      b.onclick = () => submitAnswer(q.id, opt.value);
      optionsEl.appendChild(b);
    });
  }

  // Tempo-staged reveals: meta first, text next, options stagger, actions last.
  reveal(qmeta, Math.max(120, tempo - 200));
  setTimeout(() => reveal(qtext, tempo), Math.round(tempo * 0.25));
  setTimeout(() => {
    reveal(optionsEl, tempo);
    if (q.input !== "textarea") staggerReveal(optionsEl.querySelectorAll(".opt"), tempo);
  }, Math.round(tempo * 0.5));
  setTimeout(() => reveal(actionsEl, tempo), Math.round(tempo * 0.75));
}

async function submitAnswer(qid, value) {
  const r = await answerQuestion(state, CLIENT_KEY, questions, { qid, value });
  if (!r.ok) {
    console.error("answer rejected:", r.reason);
    return;
  }
  state = r.state;
  persist(state);
  renderCurrent();
}

function renderCTA() {
  hide(qmeta); hide(qtext); hide(optionsEl); hide(actionsEl);
  qmeta.textContent = "almost there";
  qtext.textContent = "Where should we send your match?";

  optionsEl.innerHTML = `
    <label class="fineprint" style="display:block;margin-bottom:0.25rem">Email</label>
    <input type="email" id="cta-email" autocomplete="email" inputmode="email" required
      style="width:100%;padding:1rem 1.25rem;border:1px solid var(--rule);background:transparent;color:var(--ink);font-family:var(--sans);font-size:1rem">
    <label class="fineprint" style="display:block;margin:1rem 0 0.25rem">How was this? (optional)</label>
    <input type="range" id="cta-rating" min="1" max="10" value="7" style="width:100%">
    <div class="fineprint"><span id="rating-out">7</span> / 10</div>
  `;

  const sendBtn = mkBtn("Send my match →", "btn");
  sendBtn.id = "cta-send";
  sendBtn.disabled = true;
  actionsEl.innerHTML = "";
  actionsEl.appendChild(sendBtn);

  const emailEl = document.getElementById("cta-email");
  const ratingEl = document.getElementById("cta-rating");
  const ratingOut = document.getElementById("rating-out");
  ratingEl.oninput = () => { ratingOut.textContent = ratingEl.value; };
  emailEl.oninput = () => {
    sendBtn.disabled = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value);
  };

  sendBtn.onclick = async () => {
    sendBtn.disabled = true;
    const emailValue = emailEl.value.trim();
    const freetextValue = state.freetext || "";
    const ratingValue = Number(ratingEl.value);

    const r = await submitCTA(state, CLIENT_KEY, {
      email: emailValue,
      freetext: freetextValue,
      rating: ratingValue,
    });
    if (!r.ok) {
      sendBtn.disabled = false;
      return;
    }
    state = r.state;
    persist(state);

    // POST to /api/submit — server-side IDR re-sign + three fan-out side
    // effects (prospect email, Slack notify, durable persist). Never-lose-lead
    // doctrine: even on POST failure, finalise locally so user sees a
    // confirmation. The server logs the failure for ops follow-up.
    let serverResp = null;
    try {
      const res = await fetch(window.ULTRALEAD_SUBMIT_URL || "/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          firm_slug: state.firm,
          chain: state.chain,
          answers: state.answers,
          email: emailValue,
          freetext: freetextValue,
          rating: ratingValue,
        }),
      });
      if (res.ok) {
        serverResp = await res.json().catch(() => null);
      }
    } catch (err) {
      console.warn("ultralead submit POST failed (non-blocking):", err);
    }

    const fin = await finalise(state, CLIENT_KEY, {
      root_id: serverResp?.root_id || null,
      result_summary: serverResp?.services_match || null,
    });
    state = fin.state;
    persist(state);
    renderCurrent();
  };

  reveal(qmeta, 400); reveal(qtext, 400);
  setTimeout(() => reveal(optionsEl, 400), 100);
  setTimeout(() => reveal(actionsEl, 400), 200);
}

function renderDone() {
  hide(qmeta); hide(qtext); hide(optionsEl); hide(actionsEl);
  qmeta.textContent = "received";
  qtext.textContent = "We've got it. Watch your inbox.";
  optionsEl.innerHTML = `<p class="fineprint">Reference: <code>${state.root_id || "—"}</code></p>`;
  actionsEl.innerHTML = "";
  reveal(qmeta, 400); reveal(qtext, 400);
  setTimeout(() => reveal(optionsEl, 400), 100);
}

function mkBtn(label, cls) {
  const b = document.createElement("button");
  b.className = cls;
  b.type = "button";
  b.textContent = label;
  return b;
}

bootstrap();
</script>

</body>
</html>
